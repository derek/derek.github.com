    <style>
        :root {
            --bg: #ffffff;
            --fg: #2c3539;
            --muted: #6b7378;
            --card: #f4f5f6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #15181a;
                --fg: #eef0f1;
                --muted: #9aa2a7;
                --card: #23272a;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 2.5rem;
            font-size: clamp(2.75rem, 9vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: 8.5rem;
            padding: 1.25rem 0.5rem 1rem;
            border-radius: 1rem;
            color: var(--muted);
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }

        a:hover,
        a:focus-visible {
            background: var(--card);
            color: var(--fg);
            transform: translateY(-6px);
        }

        a:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }

        svg {
            display: block;
            width: 48px;
            height: 48px;
            fill: currentColor;
            transition: fill 0.15s ease;
        }

        a:hover svg,
        a:focus-visible svg {
            fill: var(--brand);
        }

        @media (prefers-color-scheme: dark) {
            a:hover svg,
            a:focus-visible svg {
                fill: var(--brand-dark);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            a, svg { transition: none; }
            a:hover, a:focus-visible { transform: none; }
        }
    </style>
