<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Derek Gathright</title>
    <meta name="description" content="Derek Gathright — find me on GitHub, LinkedIn, Twitter and Facebook.">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #2c3539;
            --muted: #6b7378;
            --card: #f4f5f6;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 0 0 2.5rem;
            font-size: clamp(2.75rem, 9vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.05;
        }

        ul {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: 8.5rem;
            padding: 1.25rem 0.5rem 1rem;
            border-radius: 1rem;
            color: var(--muted);
            font-size: 0.95rem;
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.15s ease, color 0.15s ease;
        }

        a:hover,
        a:focus-visible {
            background: var(--card);
            color: var(--fg);
            transform: translateY(-6px);
        }

        a:focus-visible {
            outline: 2px solid var(--fg);
            outline-offset: 2px;
        }

        img {
            display: block;
            width: 64px;
            height: 64px;
        }

        @media (prefers-reduced-motion: reduce) {
            a { transition: none; }
            a:hover, a:focus-visible { transform: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Derek Gathright</h1>
        <ul>
            <li><a href="https://github.com/derek"><img src="assets/logos/github.png" alt="">GitHub</a></li>
            <li><a href="https://www.linkedin.com/in/derekgathright"><img src="assets/logos/linkedin.png" alt="">LinkedIn</a></li>
            <li><a href="https://twitter.com/derekgathright"><img src="assets/logos/twitter.png" alt="">Twitter</a></li>
            <li><a href="https://derek.io/blog"><img src="assets/logos/wordpress.png" alt="">Blog</a></li>
            <li><a href="https://www.facebook.com/derekgathright"><img src="assets/logos/facebook.png" alt="">Facebook</a></li>
        </ul>
    </main>
</body>
</html>
